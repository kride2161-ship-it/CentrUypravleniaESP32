<!DOCTYPE html><html><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RNViev</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0e14;--p:#131820;--l:#1e2632;--f:#e6edf3;--d:#7d8590;--a:#00e676;--w:#ffab00}
body{background:var(--bg);color:var(--f);font:14px/1.5 -apple-system,sans-serif;padding:16px;max-width:1200px;margin:0 auto}
h1{font-size:20px;font-weight:600}h1 span{color:var(--a)}
.sub{color:var(--d);font-size:12px;margin-bottom:16px}
.layout{display:grid;grid-template-columns:280px 1fr;gap:14px}
@media(max-width:820px){.layout{grid-template-columns:1fr}}
.card{background:var(--p);border:1px solid var(--l);border-radius:12px;padding:14px;margin-bottom:12px}
.card h2{font-size:11px;font-weight:600;color:var(--d);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
.board{padding:10px;background:var(--p);border:1px solid var(--l);border-radius:8px;cursor:pointer;margin-bottom:6px}
.board:hover{border-color:var(--a)}
.board.active{border-color:var(--a);background:rgba(0,230,118,.06)}
.bid{font-weight:600;font-size:13px}.bip{font:11px ui-monospace,monospace;color:var(--d)}
.bm{display:flex;gap:10px;font-size:10px;color:var(--d);margin-top:3px}
.bm b{color:var(--f);font-weight:500}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--a);margin-right:4px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.s{background:#0a0e14;border:1px solid var(--l);border-radius:8px;padding:8px;text-align:center}
.s b{display:block;font-size:18px;font-weight:600}.s span{font-size:9px;color:var(--d);text-transform:uppercase}
.s.human b{color:var(--a)}.s.router b{color:#fff}.s.ap b{color:var(--w)}.s.total b{color:#00b0ff}
#rw{position:relative;background:#000;border:1px solid var(--l);border-radius:12px;height:420px;overflow:hidden}
#radar{width:100%;height:100%;cursor:grab;touch-action:none}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:8px;padding:6px 0;border-bottom:1px solid var(--l);font-size:12px;align-items:center}
.row:last-child{border-bottom:0}
.tag{padding:2px 7px;border-radius:4px;font-size:9px;font-weight:600;text-transform:uppercase;min-width:50px;text-align:center}
.tag.human{background:rgba(0,230,118,.15);color:var(--a)}
.tag.router{background:rgba(255,255,255,.12);color:#fff}
.tag.ap{background:rgba(255,171,0,.15);color:var(--w)}
.tag.unk{background:rgba(125,133,144,.15);color:var(--d)}
.mac{font:11px ui-monospace,monospace}.mac .ssid{color:var(--d);margin-left:5px}
.rssi{color:var(--d);font-size:11px}
.empty{text-align:center;padding:40px 20px;color:var(--d);font-size:13px}
.empty b{color:var(--f);display:block;margin-bottom:6px;font-size:15px}
</style></head><body>

<h1>RNViev <span>Center</span></h1>
<div class="sub" id="sub">Загрузка...</div>

<div class="layout">
  <div>
    <div class="card">
      <h2>Платы <span id="bc" style="color:var(--d);font-weight:400"></span></h2>
      <div id="boards"><div class="empty"><b>Плат нет</b>Ждём первую плату...</div></div>
    </div>
  </div>
  <div>
    <div class="card">
      <div style="margin-bottom:10px">
        <div style="font-size:15px;font-weight:600" id="selName">— выберите плату —</div>
        <div class="sub" id="selMeta"></div>
      </div>
      <div class="stats">
        <div class="s total"><b id="sT">0</b><span>Всего</span></div>
        <div class="s human"><b id="sH">0</b><span>Люди</span></div>
        <div class="s router"><b id="sR">0</b><span>Роутеры</span></div>
        <div class="s ap"><b id="sA">0</b><span>Точки</span></div>
      </div>
      <div id="rw"><canvas id="radar"></canvas></div>
      <div style="margin-top:14px">
        <h2 style="font-size:11px;color:var(--d);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px">Устройства</h2>
        <div id="devs"><div class="empty" style="padding:20px">Нет данных</div></div>
      </div>
    </div>
  </div>
</div>

<script>
// ============================================================
const REPO_OWNER = 'ТВОЙ_НИК';       // ← впиши
const REPO_NAME  = 'rnview';          // ← впиши
const BRANCH     = 'main';
// ============================================================

const API = 'https://api.github.com/repos/'+REPO_OWNER+'/'+REPO_NAME+'/contents';
let boards = [], selectedId = null;

async function listBoards(){
  try {
    const r = await fetch(API+'/data?ref='+BRANCH, {headers:{'Accept':'application/vnd.github+json'}});
    if (!r.ok) throw new Error(r.status);
    const files = await r.json();
    const arr = [];
    for (const f of files){
      if (!f.name.endsWith('.json')) continue;
      const d = await fetchOne(f.path);
      if (d) arr.push(d);
    }
    boards = arr;
    document.getElementById('sub').innerText = 'Плат онлайн: '+boards.length+' · '+new Date().toLocaleTimeString();
    renderBoards();
    if (selectedId){
      const b = boards.find(x=>x.id===selectedId);
      if (b) renderDetail(b);
    }
  } catch(e){
    document.getElementById('sub').innerText = 'Ошибка: '+e.message+' (проверь REPO_OWNER/REPO_NAME)';
  }
}

async function fetchOne(path){
  try {
    const r = await fetch(API+'/'+path+'?ref='+BRANCH, {headers:{'Accept':'application/vnd.github+json'}});
    if (!r.ok) return null;
    const j = await r.json();
    const txt = atob(j.content.replace(/\n/g,''));
    return JSON.parse(txt);
  } catch { return null; }
}

function renderBoards(){
  document.getElementById('bc').innerText = boards.length ? '('+boards.length+')' : '';
  const el = document.getElementById('boards');
  if (!boards.length){
    el.innerHTML = '<div class="empty"><b>Плат нет</b>Ждём первую плату...</div>';
    return;
  }
  el.innerHTML = boards.map(b=>{
    const act = selectedId === b.id ? 'active' : '';
    const hum = (b.devs||[]).filter(x=>x.t===1).length;
    return '<div class="board '+act+'" onclick="sel(\''+b.id+'\')">'
      +'<div class="bid"><span class="dot"></span>RNViev '+(b.id||'')+'</div>'
      +'<div class="bip">'+(b.ip||'')+'</div>'
      +'<div class="bm"><span>FW <b>'+(b.fw||'?')+'</b></span>'
      +'<span>Устр. <b>'+((b.devs||[]).length)+'</b></span>'
      +'<span>Люди <b>'+hum+'</b></span></div></div>';
  }).join('');
}

function sel(id){ selectedId = id; renderBoards(); const b = boards.find(x=>x.id===id); if (b) renderDetail(b); }

function renderDetail(b){
  document.getElementById('selName').innerText = 'RNViev '+b.id;
  document.getElementById('selMeta').innerText = (b.ip||'')+' · '+(b.net||'')+' · FW '+(b.fw||'');
  const d = b.devs || [];
  document.getElementById('sT').innerText = d.length;
  document.getElementById('sH').innerText = d.filter(x=>x.t===1).length;
  document.getElementById('sR').innerText = d.filter(x=>x.t===2).length;
  document.getElementById('sA').innerText = d.filter(x=>x.t===3).length;
  devices3D = d.map(x=>({t:x.t,r:x.r,dist:rd(x.r),ang:ma(x.m)}));
  let h='';
  for (const x of d.slice().sort((a,c)=>c.r-a.r)){
    const tag = x.t===1?'human':x.t===2?'router':x.t===3?'ap':'unk';
    const nm  = x.t===1?'Человек':x.t===2?'Роутер':x.t===3?'Точка':'?';
    const ss  = x.s ? '<span class="ssid">['+x.s+']</span>' : '';
    h+='<div class="row"><span class="tag '+tag+'">'+nm+'</span><div class="mac">'+x.m+ss+'</div><div class="rssi">'+x.r+' dBm</div></div>';
  }
  document.getElementById('devs').innerHTML = h || '<div class="empty" style="padding:20px">Устройств нет</div>';
}

function rd(r){ if(r>=-40)return 30; if(r<=-95)return 500; return Math.max(30,Math.min(500,Math.pow(10,(-40-r)/25)*100)); }
function ma(m){ let h=5381; for(let i=0;i<m.length;i++) h=((h<<5)+h)+m.charCodeAt(i); return (h%360)*Math.PI/180; }

const cv=document.getElementById('radar'),ctx=cv.getContext('2d');let W,H;
function rz(){const r=cv.parentNode.getBoundingClientRect();W=cv.width=r.width|0;H=cv.height=r.height|0;}
addEventListener('resize',rz);
const cam={yaw:.6,pitch:.55,dist:700,targetY:50,fov:550};
let dr=false,lx=0,ly=0;
cv.addEventListener('mousedown',e=>{dr=true;lx=e.clientX;ly=e.clientY;});
cv.addEventListener('mousemove',e=>{if(!dr)return;cam.yaw+=(e.clientX-lx)*.008;cam.pitch=Math.max(.05,Math.min(1.35,cam.pitch+(e.clientY-ly)*.006));lx=e.clientX;ly=e.clientY;});
addEventListener('mouseup',()=>dr=false);
cv.addEventListener('wheel',e=>{cam.dist=Math.max(180,Math.min(2000,cam.dist*(1+e.deltaY*.001)));e.preventDefault();},{passive:false});
cv.addEventListener('touchstart',e=>{if(e.touches.length===1){dr=true;lx=e.touches[0].clientX;ly=e.touches[0].clientY;}},{passive:true});
cv.addEventListener('touchmove',e=>{if(e.touches.length===1&&dr){cam.yaw+=(e.touches[0].clientX-lx)*.008;cam.pitch=Math.max(.05,Math.min(1.35,cam.pitch+(e.touches[0].clientY-ly)*.006));lx=e.touches[0].clientX;ly=e.touches[0].clientY;}e.preventDefault();},{passive:false});
cv.addEventListener('touchend',()=>dr=false);
function pj(x,y,z){let dx=x,dy=y-cam.targetY,dz=z;const cy=Math.cos(-cam.yaw),sy=Math.sin(-cam.yaw);let rx=dx*cy-dz*sy,rz=dx*sy+dz*cy;const cp=Math.cos(-cam.pitch),sp=Math.sin(-cam.pitch);let ry=dy*cp-rz*sp,rz2=dy*sp+rz*cp+cam.dist;if(rz2<=1)return null;const f=cam.fov/rz2;return{x:W/2+rx*f,y:H/2-ry*f,s:f};}
function floor(){const st=50,mx=300;for(let x=-mx;x<=mx;x+=st){const mj=x%100===0;ctx.strokeStyle=mj?'rgba(0,230,118,.3)':'rgba(0,230,118,.08)';ctx.lineWidth=mj?1.2:.7;const a=pj(x,0,-mx),b=pj(x,0,mx);if(a&&b){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}}for(let z=-mx;z<=mx;z+=st){const mj=z%100===0;ctx.strokeStyle=mj?'rgba(0,230,118,.3)':'rgba(0,230,118,.08)';ctx.lineWidth=mj?1.2:.7;const a=pj(-mx,0,z),b=pj(mx,0,z);if(a&&b){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}}}
const C={1:{c:[0,230,118],h:140,r:9},2:{c:[230,237,243],h:110,r:7},3:{c:[255,171,0],h:90,r:8},0:{c:[125,133,144],h:100,r:5}};
let devices3D=[];
function dv(){const s=devices3D.slice().sort((a,b)=>b.dist-a.dist);for(const d of s){const cf=C[d.t]||C[0];const x=Math.cos(d.ang)*d.dist,z=Math.sin(d.ang)*d.dist;const p=pj(x,cf.h,z),f=pj(x,0,z);if(!p)continue;const sz=Math.max(3,cf.r*p.s*6);if(f){ctx.beginPath();ctx.moveTo(f.x,f.y);ctx.lineTo(p.x,p.y);ctx.strokeStyle='rgba('+cf.c.join(',')+',.22)';ctx.lineWidth=1;ctx.stroke();}const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,sz*2.6);g.addColorStop(0,'rgba('+cf.c.join(',')+',.95)');g.addColorStop(.45,'rgba('+cf.c.join(',')+',.25)');g.addColorStop(1,'rgba('+cf.c.join(',')+',0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,sz*2.6,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgb('+cf.c.join(',')+')';ctx.beginPath();ctx.arc(p.x,p.y,sz,0,Math.PI*2);ctx.fill();if(d.t===1){const pu=(Math.sin(Date.now()/300)+1)*.5;ctx.strokeStyle='rgba('+cf.c.join(',')+','+(.85-pu*.55)+')';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,sz*(1.6+pu),0,Math.PI*2);ctx.stroke();}}}
function rn(){ctx.fillStyle='rgba(0,6,3,.42)';ctx.fillRect(0,0,W,H);floor();dv();requestAnimationFrame(rn);}
rz();rn();

listBoards();
setInterval(listBoards, 8000);
</script>
</body></html>
